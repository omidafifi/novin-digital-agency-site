<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#2437E8">
  <title>صفحه پیدا نشد (۴۰۴) | آژانس دیجیتال مارکتینگ نوین</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 40'%3E%3Crect width='34' height='40' rx='8' fill='%232437E8'/%3E%3Cpath d='M6 34V18C6 11 11 6 17 6s11 5 11 12v16' fill='none' stroke='%23fff' stroke-width='3.5' stroke-linejoin='round'/%3E%3Ccircle cx='17' cy='22' r='4.5' fill='%23FFB020'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/fonts.css">
  <style>
    :root {
      color-scheme: light;
      --bg: #F3F5FC;
      --fg: #0A0F33;
      --muted: #4A5180;
      --surface: #FFFFFF;
      --line: #D3D9F2;
      --hero-bg: #2437E8;
      --saffron: #FFB020;
      --ink: #0A0F33;
      --band: #0A0F33;
      --on-band: #EEF1FF;
      --font-display: "Noto Kufi Arabic", "Vazirmatn", Tahoma, sans-serif;
      --font-body: "Vazirmatn", Tahoma, "Segoe UI", system-ui, sans-serif;
      box-sizing: border-box;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.95 var(--font-body);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #070B25;
        --fg: #EEF1FF;
        --muted: #A3AAD6;
        --surface: #10164A;
        --line: #262F7C;
        --hero-bg: #1C2CD4;
        --band: #04061A;
      }
    }
    *, *::before, *::after { box-sizing: inherit; }
    body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    .wrap { width: 100%; max-width: 1120px; margin-inline: auto; padding-inline: 20px; }
    .top { background: var(--hero-bg); color: #fff; border-bottom: 1px solid rgba(255,255,255,.16); }
    .bar { min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-text { display: flex; flex-direction: column; line-height: 1.2; }
    .brand-text small { font-size: .7rem; opacity: .8; }
    .brand-text b { font: 900 1.5rem/1.1 var(--font-display); }
    main { flex: 1; display: grid; place-items: center; padding-block: clamp(48px, 8vw, 96px); }
    .box { max-width: 640px; padding: clamp(28px, 5vw, 48px); border: 1.5px solid var(--line); border-radius: 30px; background: var(--surface); text-align: center; }
    .code { display: inline-block; padding: 4px 18px; border-radius: 999px; background: var(--saffron); color: var(--ink); font: 900 1.15rem/1.6 var(--font-display); }
    h1 { margin: 18px 0 10px; font: 900 clamp(1.8rem, 4.5vw, 2.8rem)/1.45 var(--font-display); }
    p { margin: 0 auto; max-width: 46ch; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 28px; }
    .btn { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; padding: 8px 24px; border: 2px solid transparent; border-radius: 999px; font: 700 .95rem/1.5 var(--font-body); transition: transform .18s ease; }
    .btn:hover { transform: translateY(-2px); }
    .btn-saf { background: var(--saffron); color: var(--ink); }
    .btn-out { border-color: var(--line); color: var(--fg); }
    .btn-out:hover { border-color: var(--hero-bg); }
    footer { padding-block: 24px; background: var(--band); color: var(--on-band); text-align: center; font-size: .9rem; opacity: .9; }
  </style>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="index.html" aria-label="آژانس دیجیتال مارکتینگ نوین، صفحه اصلی">
      <svg width="34" height="40" viewBox="0 0 34 40" aria-hidden="true"><path d="M4 38V18C4 9 10 3 17 3s13 6 13 15v20" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><circle cx="17" cy="23" r="5" fill="#FFB020"/></svg>
      <span class="brand-text"><small>آژانس دیجیتال مارکتینگ</small><b>نوین</b></span>
    </a>
    <a class="btn btn-saf" href="index.html#contact">مشاوره رایگان</a>
  </div>
</header>
<main>
  <div class="wrap">
    <section class="box" aria-labelledby="notfound-title">
      <span class="code">خطای ۴۰۴</span>
      <h1 id="notfound-title">صفحه مورد نظر پیدا نشد</h1>
      <p>ممکن است آدرس صفحه تغییر کرده باشد یا پس از بازطراحی جدید وب‌سایت نوین به بخش دیگری منتقل شده باشد.</p>
      <div class="actions">
        <a class="btn btn-saf" href="index.html">بازگشت به صفحه اصلی</a>
        <a class="btn btn-out" href="services.html">مشاهده خدمات ما</a>
        <a class="btn btn-out" href="employees.html">اعضای تیم</a>
      </div>
    </section>
  </div>
</main>
<footer>
  <div class="wrap">آژانس دیجیتال مارکتینگ نوین · شیراز</div>
</footer>
</body>
</html>
