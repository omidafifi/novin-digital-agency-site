name: Deploy Novin Site to novindm.ir

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-novindm
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via FTP to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Check FTP secrets configuration
        id: check_secrets
        env:
          HAS_SERVER: ${{ secrets.FTP_SERVER != '' }}
          HAS_USER: ${{ secrets.FTP_USERNAME != '' }}
          HAS_PASS: ${{ secrets.FTP_PASSWORD != '' }}
        run: |
          if [ "$HAS_SERVER" = "true" ] && [ "$HAS_USER" = "true" ] && [ "$HAS_PASS" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "FTP secrets (FTP_SERVER, FTP_USERNAME, FTP_PASSWORD) are not configured yet. Skipping FTP deploy."
          fi

      - name: Checkout repository
        if: steps.check_secrets.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Sync production files to cPanel
        if: steps.check_secrets.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          security: loose
          server-dir: ${{ vars.FTP_SERVER_DIR || '/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .cpanel.yml
            **/.DS_Store
            *.zip
            .well-known/**
            cgi-bin/**
            wp-backup/**
